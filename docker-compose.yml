name: irradiation-budget

services:
  api:
    build: .
    image: irradiation-budget-api
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - api-data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  # One-shot acceptance suite: runs against the api service and exits.
  #   docker compose up --build --abort-on-container-exit --exit-code-from verify
  # It reuses the image built by the api service (single build, no tag race).
  verify:
    image: irradiation-budget-api
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    restart: "no"
    command: ["python", "verify.py"]

volumes:
  api-data:
